<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Alberta wild rose: 5 pink petals + gold stamen center + 2 green leaves -->
  <!-- Leaves -->
  <path d="M 28 78 Q 22 92 32 100 Q 42 90 38 76 Z" fill="#5e8b4a" opacity="0.95"/>
  <path d="M 32 80 Q 30 88 34 96" stroke="#3d6a30" stroke-width="0.8" fill="none"/>
  <path d="M 92 78 Q 98 92 88 100 Q 78 90 82 76 Z" fill="#5e8b4a" opacity="0.95"/>
  <path d="M 88 80 Q 90 88 86 96" stroke="#3d6a30" stroke-width="0.8" fill="none"/>
  <!-- 5 petals arranged radially around center 60,60 -->
  <g transform="translate(60 60)">
    <!-- Top petal -->
    <ellipse cx="0" cy="-22" rx="14" ry="20" fill="#e89bb1" transform="rotate(0)"/>
    <ellipse cx="0" cy="-22" rx="11" ry="17" fill="#f0b1c4" transform="rotate(0)"/>
    <!-- Top right -->
    <ellipse cx="0" cy="-22" rx="14" ry="20" fill="#e89bb1" transform="rotate(72)"/>
    <ellipse cx="0" cy="-22" rx="11" ry="17" fill="#f0b1c4" transform="rotate(72)"/>
    <!-- Bottom right -->
    <ellipse cx="0" cy="-22" rx="14" ry="20" fill="#e89bb1" transform="rotate(144)"/>
    <ellipse cx="0" cy="-22" rx="11" ry="17" fill="#f0b1c4" transform="rotate(144)"/>
    <!-- Bottom left -->
    <ellipse cx="0" cy="-22" rx="14" ry="20" fill="#e89bb1" transform="rotate(216)"/>
    <ellipse cx="0" cy="-22" rx="11" ry="17" fill="#f0b1c4" transform="rotate(216)"/>
    <!-- Top left -->
    <ellipse cx="0" cy="-22" rx="14" ry="20" fill="#e89bb1" transform="rotate(288)"/>
    <ellipse cx="0" cy="-22" rx="11" ry="17" fill="#f0b1c4" transform="rotate(288)"/>
    <!-- Stamen rays -->
    <g stroke="#fff5d6" stroke-width="0.6" stroke-linecap="round" opacity="0.9">
      <line x1="0" y1="-12" x2="0" y2="-22"/>
      <line x1="-7" y1="-10" x2="-13" y2="-18"/>
      <line x1="7" y1="-10" x2="13" y2="-18"/>
      <line x1="-11" y1="-5" x2="-19" y2="-9"/>
      <line x1="11" y1="-5" x2="19" y2="-9"/>
      <line x1="-12" y1="3" x2="-21" y2="5"/>
      <line x1="12" y1="3" x2="21" y2="5"/>
      <line x1="-10" y1="10" x2="-17" y2="17"/>
      <line x1="10" y1="10" x2="17" y2="17"/>
      <line x1="-5" y1="13" x2="-9" y2="22"/>
      <line x1="5" y1="13" x2="9" y2="22"/>
      <line x1="0" y1="14" x2="0" y2="24"/>
    </g>
    <!-- Gold center -->
    <circle cx="0" cy="0" r="9" fill="#d4a017"/>
    <circle cx="0" cy="0" r="7" fill="#f5b942"/>
    <!-- Stamen dots -->
    <g fill="#8a6d10">
      <circle cx="-3" cy="-3" r="0.9"/>
      <circle cx="3" cy="-3" r="0.9"/>
      <circle cx="-4" cy="2" r="0.9"/>
      <circle cx="4" cy="2" r="0.9"/>
      <circle cx="0" cy="4" r="0.9"/>
      <circle cx="0" cy="-5" r="0.9"/>
      <circle cx="-5" cy="-1" r="0.9"/>
      <circle cx="5" cy="-1" r="0.9"/>
    </g>
  </g>
</svg>
