# ─────────────────────────────────────────────────────────────────────────
# PDF folder move, September 2026
#
# Every PDF folder moved from /pdfs/<folder>/ to /pdfs/aish-adap/<folder>/.
# These rules keep every link that existed before the move working —
# printed inside our own documents, shared on Facebook, bookmarked, or
# sitting in 115 daily posts.
#
# force = false means a real file at the new path wins; the redirect only
# fires for the old path. 301 tells search engines the move is permanent.
#
# IMPORTANT: paste these ABOVE the catch-all rule at the bottom of
# netlify.toml. Netlify applies the first matching rule, so anything below
# the catch-all never runs.
# ─────────────────────────────────────────────────────────────────────────

[[redirects]]
  from = "/pdfs/access-gap/*"
  to = "/pdfs/aish-adap/access-gap/:splat"
  status = 301
  force = false

