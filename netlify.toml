# Netlify configuration — drop-in deploy

[build]
  publish = "."

# Cache PDFs aggressively (immutable file names)
[[headers]]
  for = "/pdfs/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"

# Cache assets aggressively
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# CSS and JS — short cache so updates roll out quickly
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "interest-cohort=()"

# Force trailing slash for index
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# 404 fallback to home
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
